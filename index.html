<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doug's Playground</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet">
    <link rel="icon" href="../img/mercury.gif">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/main.css">
    <style>
        body {
            margin: 0px;
            cursor: url('./misc/carmageddon/1.cur'), auto;
        }

        a,
        label,
        button,
        label.upload-btn {
            cursor: url('./misc/carmageddon/2.cur'), auto;
        }

        iframe {
            cursor: url('./misc/carmageddon/1.cur'), auto;
        }

        .come-play {
            background-color: #a39c92;
            font-size: 30px;
            width: fit-content;
            padding: 0px 10px 0px 30px;
            margin-right: 10px;
            border-top: 2px solid #FFFFFF;
            border-left: 2px solid #FFFFFF;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
        }

        .entry-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .no-overflow {
            overflow: hidden;
        }

        .loading-box {
            display: none;
        }

        .loading-box.active {
            display: block;
        }

        .loading-image {
            display: block;
            max-width: 250px;
            height: auto;
            margin: 0 auto 15px auto;
        }

        .loading-bar {
            width: 250px;
            height: 20px;
            background: #FFFFFF;
            border: 2px inset #808080;
            overflow: hidden;
        }

        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background: #a50d02;
            animation: fillBar 2.5s ease-in-out forwards;
        }

        @keyframes fillBar {
            to {
                width: 100%;
            }
        }
    </style>

    <!-- JS -->
    <script src="../js/main.js" defer></script>
</head>

<body class="no-overflow">
    <div class="entry-container">
        <img class="splash-image" id="splashImage" src="./img/axkpgi-ezgif.com-crop.gif">
        <a href="../../index2.html" id="playLink" style="text-decoration: none; color: inherit;">
            <p class="come-play">Come play.</p>
        </a>
    </div>
</body>

</html>
