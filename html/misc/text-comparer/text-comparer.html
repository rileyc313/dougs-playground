<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doug's Playground</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet">
    <link rel="icon" href="/img/favicon.png">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body {
            margin: 0px;
            cursor: url('/misc/carmageddon/1.cur'), auto;
        }

        a,
        label,
        button,
        label.upload-btn,
        .mercury-header-gif,
        .musical-notes,
        input, {
            cursor: url('/misc/carmageddon/2.cur'), auto;
        }

        iframe {
            cursor: url('/misc/carmageddon/1.cur'), auto;
        }

        #loading-overlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            background: black;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 999999999;

            transition: opacity .4s;
        }

        #loading-overlay.loaded {
            opacity: 0;
            pointer-events: none;
        }

        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loading-bar {
            width: 250px;
            height: 18px;

            background: #d0d0d0;

            border: 2px inset #808080;

            overflow: hidden;
        }

        .loading-bar-fill {
            width: 0%;
            height: 100%;

            background: #a50d02;
        }
    </style>
    <script src="/js/albums.js" defer></script>
    <script src="/js/page-chrome.js" defer></script>
    <script src="/js/banners.js" defer></script>
    <script src="/js/onthisday.js" defer></script>
    <script src="/js/pixel-upload.js" defer></script>
    <script src="/js/sidebar-widgets.js" defer></script>
    <script src="/js/sitemap.js" defer></script>
    <script src="/js/text-comparer.js" defer></script> 
</head>

<body>
   <img class="backdrop">
    <div class="splash-image-container">
        <a href="/home.html"><img class="splash-image" src="/img/dougsplaygroundsplash.gif"></a>
    </div>
    <section class="main-body">
        <div class="container-left">
            <div class="bubble">
                <div id="site-map-widget"></div>
            </div>
        </div>
        <div class="container-main flex-column">
        <div class="bubble">
          <div class="flex" style="vertical-align: middle;">
            <p style="font-weight: 900;">Misc. pages</p> &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp;
              <a href="/html/misc/main.html">
                <p>back</p>
              </a>
            </p>
          </div>
          <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fmedia1.tenor.com%2Fm%2Ftm4JV1Qs15AAAAAC%2Fthe-interview-james-franco.gif&f=1&nofb=1&ipt=3f97eaeba0005511fc973c77711db1e5936d08cbfc0ca59f61dae2b432cce5e7" class="d-banner">
          <p>The two boxes below serve as a comparison app for 2 sentences. Enter them seperately into each, and the output below the inputs will highlight the differences in <mark>yellow</mark>.</p>
          <div style="display: flex; flex-direction: column;">
            <div class="flex " style="flex-direction: row; gap:20px; width: 100%">
              <div style="display: flex; flex: 1; flex-direction: column;">
                <p style="font-size: 8px;">Input 1</p>
                <input style="flex: 1" type="input" id="textCompare1" name="Text 1" value="">
              </div>
              <div style="display: flex; flex: 1; flex-direction: column;">
                <p style="font-size: 8px;">Input 2</p>
                <input style="flex: 1" type="input" id="textCompare2" name="Text 2" value="">
              </div>
            </div>
            <p style="font-size: 8px; margin-top: 20px;">Output:</p>
          <div id="differenceOutput" style="display: flex; flex-direction: row; gap: 20px;"></div>
        </div>
        </div>
        </div>
    <div class="container-right"></div>
    </section>
    <section class="footer-container">
        <div class="banner-container">
            <div class="banner-track" id="bannerTrack"></div>
        </div>
        <div class="bubble-no-border">
            <p>Est. June, 2026 | Human Made.</p>
        </div>
    </section>
</body>

</html>
