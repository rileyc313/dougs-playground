<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doug's Playground</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet">
    <link rel="icon" href="/img/mercury.gif">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body {
            margin: 0px;
            cursor: url('../../misc/carmageddon/1.cur'), auto;
        }

        a,
        label,
        button,
        label.upload-btn,
        .mercury-header-gif,
        #themeButtons {
            cursor: url('../../misc/carmageddon/2.cur'), auto;
        }

        .upload-btn.theme-btn,
        .upload-btn {
            cursor: url('../../misc/carmageddon/2.cur'), auto;
        }

        iframe {
            cursor: url('./misc/carmageddon/1.cur'), auto;
        }

        .firepit-img {
            display: none;
            width: 100%;
        }

        .firepit-img.active {
            display: block;
        }

        #themeButtons {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: fit-content;
            place-items: center;
        }

        #themeButtons .theme-btn {
            width: 110px;
            box-sizing: border-box;
            text-align: center;
            padding: 10px 12px
        }

        #soundToggle {
            position: absolute;
            bottom: 8px;
            right: 8px;
            z-index: 2;
            width: auto;
            padding: 10px 12px;
            font-size: 8px;
        }

        #fullscreenToggle {
            position: absolute;
            bottom: 8px;
            left: 8px;
            z-index: 2;
            width: auto;
            padding: 10px 12px;
            font-size: 8px;
        }
    </style>

    <!-- JS -->
    <script src="/js/banners.js" defer></script>
    <script src="/js/page-chrome.js" defer></script>
    <script src="/js/sitemap.js" defer></script>
</head>

<body>
    <img class="backdrop">
    <div class="splash-image-container">
        <a href="/home.html"><img class="splash-image" src="/img/dougsplaygroundsplash.gif"></a>
    </div>
    <section class="main-body">
        <div class="container-left">
            <div class="bubble">
                <div id="site-map-widget"></div>
            </div>
        </div>
        <div class="container-main flex-column">
            <div class="bubble">
                <p style="font-weight: 900;">Welcome to the fire pit&nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp;
                    <a href="/home.html">back</a>
                </p>
                <p>Stay as long as you like, and choose from our variety of themes that suit your exquisite taste.</p>
                <div
                    style="display: flex; width: 100%; justify-content: center; align-items: center; flex-direction: column;">
                    <div class="buttons" id="themeButtons">
                        <button class="upload-btn theme-btn active" data-theme="classic">Classic</button>
                        <button class="upload-btn theme-btn" data-theme="darksouls">Dark Souls</button>
                        <button class="upload-btn theme-btn" data-theme="osrs">OSRS</button>
                        <button class="upload-btn theme-btn" data-theme="destiny">Destiny</button>
                        <button class="upload-btn theme-btn" data-theme="vader">Vader</button>
                        <button class="upload-btn theme-btn" data-theme="skeleton">Skeleton</button>
                    </div>
                </div>
            </div>

            <div class="bubble" id="firepitStage" style="position: relative; padding: 0; overflow: hidden;">
                <img id="img-classic" class="bubble-fitted-image firepit-img active" src="/img/firepit/classic.gif"
                    alt="Classic">
                <img id="img-darksouls" class="bubble-fitted-image firepit-img" src="/img/firepit/darksouls.gif"
                    alt="Dark Souls">
                <img id="img-osrs" class="bubble-fitted-image firepit-img" src="/img/firepit/osrs.gif" alt="OSRS">
                <img id="img-destiny" class="bubble-fitted-image firepit-img" src="/img/firepit/destiny.gif"
                    alt="Destiny">
                <img id="img-vader" class="bubble-fitted-image firepit-img" src="/img/firepit/vader.gif" alt="Vader">
                <img id="img-skeleton" class="bubble-fitted-image firepit-img" src="/img/firepit/skeleton.gif"
                    alt="Skeleton">
                <button id="fullscreenToggle" class="upload-btn" type="button">â›¶ Fullscreen</button>
                <button id="soundToggle" class="upload-btn" type="button">ðŸ”Š Mute</button>
            </div>
        </div>
        <div class="container-right"></div>
    </section>
    <section class="footer-container">
        <div class="banner-container">
            <div class="banner-track" id="bannerTrack"></div>
        </div>
        <div class="bubble-no-border">
            <p>Est. June, 2026 | Human Made.</p>
        </div>
    </section>
    <audio id="fireCrackle" src="/audio/firecrackle.mp3" loop preload="auto"></audio>
    <script>
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = btn.dataset.theme;

                document.querySelectorAll('.firepit-img').forEach(img => img.classList.remove('active'));
                document.getElementById('img-' + id).classList.add('active');

                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        const crackle = document.getElementById('fireCrackle');
        const soundToggle = document.getElementById('soundToggle');
        let unlocked = false;

        function updateSoundLabel() {
            soundToggle.textContent = crackle.muted ? 'Unmute' : 'Mute';
        }

        function tryAutoplay() {
            const playPromise = crackle.play();
            if (playPromise !== undefined) {
                playPromise
                    .then(() => {
                        unlocked = true;
                        updateSoundLabel();
                    })
                    .catch(() => {
                        crackle.muted = true;
                        updateSoundLabel();

                        const unlock = () => {
                            crackle.muted = false;
                            crackle.play();
                            unlocked = true;
                            updateSoundLabel();
                            document.removeEventListener('click', unlock);
                            document.removeEventListener('keydown', unlock);
                        };
                        document.addEventListener('click', unlock, { once: true });
                        document.addEventListener('keydown', unlock, { once: true });
                    });
            }
        }

        tryAutoplay();

        soundToggle.addEventListener('click', () => {
            crackle.muted = !crackle.muted;
            updateSoundLabel();
            if (!unlocked) {
                crackle.play();
                unlocked = true;
            }
        });

        const firepitStage = document.getElementById('firepitStage');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function isFullscreen() {
            return document.fullscreenElement || document.webkitFullscreenElement;
        }

        fullscreenToggle.addEventListener('click', () => {
            if (!isFullscreen()) {
                if (firepitStage.requestFullscreen) {
                    firepitStage.requestFullscreen();
                } else if (firepitStage.webkitRequestFullscreen) {
                    firepitStage.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        });

        function updateFullscreenLabel() {
            fullscreenToggle.textContent = isFullscreen() ? 'Exit' : 'Fullscreen';
        }

        document.addEventListener('fullscreenchange', updateFullscreenLabel);
        document.addEventListener('webkitfullscreenchange', updateFullscreenLabel);
    </script>

</body>

</html>
