<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doug's Playground</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet">
    <link rel="icon" href="../img/mercury.gif">

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        body {
            margin: 0px;
            cursor: url('../../misc/carmageddon/1.cur'), auto;
        }

        a, 
        label, 
        button,
        label.upload-btn,
        .mercury-header-gif,
        #themeButtons {
            cursor: url('../../misc/carmageddon/2.cur'), auto;
        }

        .upload-btn.theme-btn {
            cursor: url('../../misc/carmageddon/2.cur'), auto;
        }

        iframe{
            cursor: url('./misc/carmageddon/1.cur'), auto;
        }

        .firepit-img {
            display: none;
            width: 100%;
        }
        .firepit-img.active {
            display: block;
        }
        #themeButtons {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: fit-content;
            place-items: center;
        }

        #themeButtons .theme-btn {
            width: 110px;
            box-sizing: border-box;
            text-align: center;
        }
    </style>

    <!-- JS -->
    <script src="../js/main.js" defer></script>

</head>

<body>
    <img class="backdrop">
    <div class="splash-image-container">
        <a href="../../index2.html"><img class="splash-image" src="../../img/dougsplaygroundsplash.gif"></a>
    </div>
    <section class="main-body">
        <div class="container-main flex-column">
            <div class="bubble">
                <p style="font-weight: 900;">Welcome to the fire pit&nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp;<a
                        href="../../index2.html">back</a></p>
                <p>Stay as long as you like, and choose from our variety of themes that suit your exquisite taste.</p>
                <div style="display: flex; width: 100%; justify-content: center; align-items: center; flex-direction: column;">
                    <div class="buttons" id="themeButtons">
                        <button class="upload-btn theme-btn active" data-theme="classic">Classic</button>
                        <button class="upload-btn theme-btn"        data-theme="darksouls">Dark Souls</button>
                        <button class="upload-btn theme-btn"        data-theme="osrs">OSRS</button>
                        <button class="upload-btn theme-btn"        data-theme="destiny">Destiny</button>
                        <button class="upload-btn theme-btn"         data-theme="vader">Vader</button>
                        <button class="upload-btn theme-btn"         data-theme="skeleton">Skeleton</button>
                </div>
            </div>
            </div>
            
            <div class="bubble" id="firepitStage" style="position: relative; padding: 0; overflow: hidden;">
                <img id="img-classic" class="bubble-fitted-image firepit-img active" src="../../img/firepit/classic.gif" alt="Classic">
                <img id="img-darksouls"   class="bubble-fitted-image firepit-img"        src="../../img/firepit/darksouls.gif"   alt="Dark Souls">
                <img id="img-osrs"   class="bubble-fitted-image firepit-img"        src="../../img/firepit/osrs.gif"   alt="OSRS">
                <img id="img-destiny"   class="bubble-fitted-image firepit-img"        src="../../img/firepit/destiny.gif"   alt="Destiny">
                <img id="img-vader"   class="bubble-fitted-image firepit-img"        src="../../img/firepit/vader.gif"   alt="Vader">
                <img id="img-skeleton"   class="bubble-fitted-image firepit-img"        src="../../img/firepit/skeleton.gif"   alt="Skeleton">
            </div>
        </div>
    </section>
    <section class="footer-container">
        <div class="banner-container">
            <div class="banner-track">
                <div class="banner-group">
                    <a href="https://jamescyberzone.neocities.org/" target="_blank" rel="noopener">
                        <img src="https://jamescyberzone.neocities.org/Button1.png" alt="James Cyberzone">
                    </a>
                    <a href="https://frutigeraeroarchive.org/" target="_blank"><img
                            src="https://frutigeraeroarchive.org/images/buttons/frutigeraeroarchive_button_legacy.png"
                            alt="Frutiger Aero Archive"></a>
                    <a href="https://webgore.neocities.org/" target="_blank"><img
                            src="https://webgore.neocities.org/images/sitebutton.gif"></a>
                    <a href="https://camo93.neocities.org/"><img src="https://camo93.neocities.org/button.png"></a>
                    <a href="https://orloktopia.neocities.org/"><img
                            src="https://orloktopia.neocities.org/images/88x31/orloktopia88x31-MARK2.png"></a>
                    <a href="https://petrapixel.neocities.org/" target="_blank"><img
                            src="https://cdn.jsdelivr.net/gh/petracoding/petrapixel.neocities.org@latest/public/assets/img/linkback.gif"
                            alt="petrapixel"></a>
                    <a href="https://onio.club" target="_blank"><img
                            src="https://onio.club/buttons/oniobutton2.gif"></a>
                    <a href="https://neocities.org/" target="_blank"><img src="../../img/neocities.gif"></a>

                </div>
                <div class="banner-group" aria-hidden="true">
                    <a href="https://jamescyberzone.neocities.org/" target="_blank" rel="noopener">
                        <img src="https://jamescyberzone.neocities.org/Button1.png" alt="James Cyberzone">
                    </a>
                    <a href="https://frutigeraeroarchive.org/" target="_blank"><img
                            src="https://frutigeraeroarchive.org/images/buttons/frutigeraeroarchive_button_legacy.png"
                            alt="Frutiger Aero Archive"></a>
                    <a href="https://webgore.neocities.org/" target="_blank"><img
                            src="https://webgore.neocities.org/images/sitebutton.gif"></a>
                    <a href="https://camo93.neocities.org/"><img src="https://camo93.neocities.org/button.png"></a>
                    <a href="https://orloktopia.neocities.org/"></a><img
                        src="https://orloktopia.neocities.org/images/88x31/orloktopia88x31-MARK2.png"></a>
                    <a href="https://petrapixel.neocities.org/" target="_blank"><img
                            src="https://cdn.jsdelivr.net/gh/petracoding/petrapixel.neocities.org@latest/public/assets/img/linkback.gif"
                            alt="petrapixel"></a>
                    <a href="https://onio.club" target="_blank"><img
                            src="https://onio.club/buttons/oniobutton2.gif"></a>
                    <a href="https://neocities.org/" target="_blank"><img src="../../img/neocities.gif"></a>

                </div>
            </div>
        </div>
        <div class="bubble-no-border">
            <p>Est. June, 2026 | Human Made.</p>
        </div>
    </section>

    <script>
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = btn.dataset.theme;

                document.querySelectorAll('.firepit-img').forEach(img => img.classList.remove('active'));
                document.getElementById('img-' + id).classList.add('active');

                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
    </script>

</body>

</html>
